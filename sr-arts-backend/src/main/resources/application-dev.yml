spring:
  datasource:
    url: jdbc:mysql://localhost:3306/sr_arts_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

    show-sql: true

    properties:
      hibernate:
        format_sql: true


  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.hibernate.SQL: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true